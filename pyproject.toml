[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kwsed"
version = "0.1.0"
description = "Terminal browser for the Korg Wavestation SR"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = ["textual>=0.40", "python-rtmidi>=1.5"]

[project.scripts]
kwsed = "kwsed.app:main"
kwscli = "kwsed.cli:main"

[tool.setuptools]
packages = ["kws", "kwsed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
