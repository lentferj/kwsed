[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kwsed"
version = "0.1.0"
description = "Terminal browser for the Korg Wavestation SR"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = ["textual>=0.40", "python-rtmidi>=1.5", "vinsynlib>=0.4.2"]

[project.scripts]
kwsed = "kwsed.entry:app"
kwscli = "kwsed.entry:cli"

[tool.setuptools]
packages = ["kws", "kwsed"]

# --- ruff: linting and formatting (replaces flake8/isort/black/pyupgrade) ----
#
# See docs/QUALITY_CHECKS.md for why each pre-existing suppression exists.
[tool.ruff]
line-length = 88
target-version = "py311"
# kws/data/ holds the user's generated name catalog and is gitignored.
extend-exclude = ["kws/data"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "S",     # bandit
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "C4",    # flake8-comprehensions
    "PL",    # pylint
    "RUF",   # ruff-specific
    "C901",  # mccabe complexity
]
# Each of these conflicts with a convention this codebase follows on purpose.
# They are disabled wholesale rather than per-file because they are properties
# of the whole style, not of particular files; the counts are the number of
# existing occurrences suppressed project-wide.
ignore = [
    # 215 - the project uses typing.Dict/List/Optional consistently under
    # `from __future__ import annotations`; rewriting every annotation is a
    # refactor, not a lint fix.
    "UP006", "UP035", "UP045", "UP037",
    # 55 - local imports are deliberate: `rtmidi` is imported lazily so
    # `kwscli banks` works with no MIDI backend, and the tests import inside
    # functions for pytest.importorskip.
    "PLC0415",
    # 96 - protocol offsets, record sizes and function codes are compared as
    # literals throughout, which is how binary formats read.
    "PLR2004",
    # 14 - complexity / argument-count refactor suggestions, not defects.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    # 41 - established stylistic conventions: `[a] + [b]`, class-level constant
    # tables, and `__all__` ordered by protocol rather than alphabetically.
    "RUF005", "RUF012", "RUF022",
    # 6 - an explicit try/except reads better than contextlib.suppress here.
    "SIM105",
    # 3 - zip(strict=) changes runtime behaviour; enabling it is a decision.
    "B905",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
# vinsynlib is a sibling checkout rather than a published package, so ruff
# cannot tell that it is ours and not third-party. Saying so keeps the import
# block in one piece instead of splitting the family's code away from this
# project's.
known-first-party = ["kws", "kwsed", "vinsynlib"]

# Existing findings only. A new file, or a new occurrence in a file not listed
# here, is still reported.
[tool.ruff.lint.per-file-ignores]
# tests: S101 (assert) is what a test is for; F401 covers imports used for
# registration or availability rather than for a name.
"tests/*" = ["S101", "F401"]
# `first = step` in make_waveseq: a snapshot of the step counter taken before
# the loop advances it. Kept rather than deleted, because it reads like the
# remains of an assertion this fixture was meant to make about where a chain
# starts -- deleting it would remove the evidence. See
# docs/QUALITY_CHECKS.md.
"tests/test_banks_dumps.py" = ["I001"]
"tests/test_favorites.py" = ["I001"]
"tests/test_review_fixes.py" = ["I001"]
"tests/test_write.py" = ["I001", "S110"]
"tools/build_bank.py" = ["B904", "C901", "I001"]
"tools/extract_catalog.py" = ["I001"]
# kws/favorites.py and kws/config.py used to need E501, RUF023, S608, PLW0603
# and UP031 for the copies of the settings cache and the favourites database
# they each carried. Both are shims over vinsynlib now, so those suppressions
# are removed rather than left behind guarding nothing. If a line is ever
# long here again, fix it: these were never a convention.
"kws/messages.py" = ["PLW1641"]
# C901: the write fence and the bank planner are complex by construction;
# splitting them would fragment the one place each rule is enforced.
"kws/bankbuild.py" = ["B007", "B008", "C901", "I001"]
"kws/bridge.py" = ["C901", "I001", "S110", "S112"]
"kws/catalog.py" = ["I001"]
"kws/deps.py" = ["B007"]
"kwsed/app.py" = ["B904", "I001", "PLW0108"]
"kwsed/cli.py" = ["C416", "C901", "I001"]
"kwsed/demo.py" = ["I001"]

[tool.ruff.lint.flake8-bugbear]
# zip() without strict= is pre-existing; B905 is disabled above anyway.

# --- mypy: type checking ----------------------------------------------------
#
# Strict, on the library. The relaxation below is narrow and deliberate: it
# covers only the requirement that *every* function carry a signature, and
# only outside kws/ and kwsed/.
#
# Annotating a test is close to no work. `def test_it_behaves():` says nothing
# a type checker did not already learn from the assert, and requiring
# `-> None` on 240 of them buys annotation noise and no checking. Inside the
# library it is the opposite: a Textual callback or a bridge method reached
# only from the framework is exactly where a wrong signature goes unnoticed,
# because nothing calls it in a way mypy can see. So the library carries its
# signatures and is checked for them; the tests are checked for everything
# else.
[tool.mypy]
python_version = "3.11"
files = ["kws", "kwsed", "tools", "tests"]
strict = true
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
exclude = ['^kws/data/']

[[tool.mypy.overrides]]
# Listed rather than wildcarded. mypy names these modules after the file --
# test_app, not tests.test_app, because neither directory is a package -- and
# `test_*` is accepted as matching without actually being applied, with no
# "unused section" note to warn that it did nothing. An explicit list cannot
# fail quietly; a new test file will simply be checked strictly, which is the
# safe direction to fail in.
module = [
    # tests is a package (see tests/__init__.py), so this wildcard really
    # applies. It did not before that file existed, and mypy gave no
    # warning that it was not applying it.
    "tests.*",
    # tools/ is not a package -- its scripts are run directly by path -- so
    # these three are named. There are only three, and they change rarely.
    "build_bank",
    "extract_catalog",
    "measure_send_gap",
]
# The two go together. Allowing an untyped def while still forbidding calls to
# it would leave every test that calls a local helper reporting the helper
# rather than the code under test, which is noise pointing the wrong way.
disallow_untyped_defs = false
disallow_untyped_calls = false

# --- pytest and coverage ----------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=kws --cov=kwsed --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["kws", "kwsed"]

[tool.coverage.report]
show_missing = true
# The floor for the whole tree, statements and branches combined (which is
# what fail_under compares -- not the headline percentage, and not the
# statement figure on its own).
#
# Current is 75.7%, so this leaves about five points of headroom: roughly
# 165 statements of slack. Setting it at the current number instead would
# leave nothing, and the first ordinary commit that added ten uncovered
# lines would fail the build -- at which point the gate gets deleted rather
# than the tests get written.
#
# Per-module floors for the pure-logic modules are in the Makefile
# (`make coverage-floor`), because coverage has no way to express them here.
fail_under = 70
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# --- vulture: dead code ------------------------------------------------------
[tool.vulture]
min_confidence = 80
paths = ["kws", "kwsed", "tools", "tests"]

# --- deptry: dependency hygiene ---------------------------------------------
[tool.deptry]
# kws/data is a data directory, not a package.
extend_exclude = ["\\.venv"]